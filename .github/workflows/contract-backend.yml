name: Contract Tests (Backend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-backend:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: src/backend

      - name: Start backend
        run: npx tsx src/backend/src/server.ts &
        env:
          PORT: 3001

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/contracts/backend_tests/requirements.txt

      - name: Install Python deps
        run: pip install -r tests/contracts/backend_tests/requirements.txt

      - name: Run contract tests
        run: python -m pytest --tb=short -q --junit-xml=.pytest_results/results.xml
        working-directory: tests/contracts/backend_tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-backend-results
          path: tests/contracts/backend_tests/.pytest_results/
          retention-days: 7
