name: Contract Tests — Backend

on:
  push:
    branches: [main, "demo/**"]
    paths:
      - "src/backend/**"
      - "tests/contracts/openapi.yaml"
      - ".github/workflows/contract-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "tests/contracts/openapi.yaml"

jobs:
  contract-backend:
    name: Validate backend against OpenAPI schema
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: src/backend

      - name: Build backend
        run: npm run build
        working-directory: src/backend

      - name: Start backend
        run: PORT=3001 FRONTEND_ORIGIN=http://localhost:4173 npm start &
        working-directory: src/backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Run contract tests (schema validation)
        run: |
          schemathesis run tests/contracts/openapi.yaml \
            --url http://localhost:3001 \
            --checks all \
            --validate-schema true \
            --hypothesis-max-examples 20 \
            --exclude-path /api/talks/{id}/vote \
            --exclude-path /api/talks/{id}/status
